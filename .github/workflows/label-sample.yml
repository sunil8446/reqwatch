name: label-sample

# Manually dispatched: exports a stratified labeling sample from Neon as a
# downloadable artifact. Data is NEVER committed to the repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Export sample
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m reqwatch.export_label_sample
      - uses: actions/upload-artifact@v4
        with:
          name: label-sample
          path: label_sample.csv
          retention-days: 30
