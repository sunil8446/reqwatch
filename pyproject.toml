[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqwatch"
version = "0.1.0"
description = "Job-market intelligence: incremental ingestion of public ATS job boards with SCD2 history"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "psycopg[binary]>=3.2", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
